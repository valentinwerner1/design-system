# Ruff config — shared baseline. Ruff replaces flake8 + isort + pyupgrade + black.
#
# Deliberately not maximal. Rules that fight a pragmatic, comment-heavy style produce
# noise, and a linter people silence is worse than no linter.

line-length = 100
target-version = "py311"

exclude = [
    ".venv", "venv", "__pycache__", "build", "dist",
    "spikes",        # exploratory code — held to a different standard on purpose
    "scratchpad",
]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — real errors: undefined names, unused imports
    "I",        # import sorting
    "UP",       # pyupgrade — modern syntax for the target version
    "B",        # bugbear — mutable default args, loop-variable capture, etc.
    "SIM",      # obvious simplifications
    "C4",       # comprehension cleanups
]
ignore = [
    "E501",     # line length — the formatter owns this; flagging it twice is noise
    "B008",     # call in default arg: standard practice in FastAPI (Depends())
    "SIM108",   # ternary-instead-of-if: often less readable, not always a win
]

[lint.per-file-ignores]
# Tests may shadow, assert freely, and import lazily.
"tests/**" = ["F811", "B011"]
# Conformance tests deliberately read source as data.
"tests/test_conformance.py" = ["S101"]

[format]
quote-style = "double"
skip-magic-trailing-comma = false
